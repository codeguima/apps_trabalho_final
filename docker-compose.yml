version: '3.8'

services:
  node-api:
    build:
      context: ./node-api
    ports:
      - "3000:3000"
    depends_on:
      - db
      - rabbitmq
    environment:
      DB_USERNAME: positivo
      DB_PASSWORD: root
      DB_NAME: sistemademensagem
      DB_HOST: db
      DB_DIALECT: mysql
      TZ: America/Sao_Paulo
      RABBITMQ_HOST: rabbitmq
    volumes:
      - ./node-api:/app
      - /app/node_modules
    working_dir: /app
    command: ["npm", "start"]
    networks:
      - app-networks

  python-api:
    build:
      context: ./python-api
    ports:
      - "5000:5000"  
    depends_on:
      - db
      - rabbitmq
    environment:
      DB_USER: positivo
      DB_PASSWORD: root
      DB_NAME: sistemademensagem
      DB_HOST: db
      RABBITMQ_HOST: rabbitmq
      TZ: America/Sao_Paulo
    volumes:
      - ./python-api:/app
    working_dir: /app
    command: ["python", "consumer.py"]  # ajuste conforme seu entrypoint
    
    networks:
      - app-networks

  php-api:
    build:
      context: ./php-api
    depends_on:
      - db
      - rabbitmq
    environment:
      DB_USER: positivo
      DB_PASSWORD: root
      DB_NAME: sistemademensagem
      DB_HOST: db
      RABBITMQ_HOST: rabbitmq
      JWT_SECRET: sua_chave_secreta_aqui
      TZ: America/Sao_Paulo
    volumes:
      - ./php-api:/var/www/html
    working_dir: /var/www/html
    command: ["php", "-S", "0.0.0.0:8000", "-t", "."]  # ajuste conforme necessário
    ports:
      - "8000:8000"
    networks:
      - app-networks

  db:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sistemademensagem
      MYSQL_USER: positivo
      MYSQL_PASSWORD: root
      TZ: America/Sao_Paulo
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-networks

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"     # porta para conexões AMQP
      - "15672:15672"   # porta para painel de gerenciamento web
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    networks:
      - app-networks

volumes:
  db_data:

networks:
  app-networks:
    driver: bridge

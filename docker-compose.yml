services:
  db:
    container_name: apps_trabalho_final-db
    image: bitnami/mysql:latest
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=university
      - MYSQL_DATABASE=sistemademensagem
    volumes:
      - db_data:/bitnami/mysql/data
    networks:
      - app-networks

  redis:
    container_name: apps_trabalho_final-cache
    image: bitnami/redis:latest
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=university
    volumes:
      - redis_data:/bitnami/redis/data
    networks:
      - app-networks

  rabbitmq:
    container_name: apps_trabalho_final-rabbitmq
    image: bitnami/rabbitmq:latest
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
      - RABBITMQ_MANAGEMENT_ALLOW_WEB_ACCESS=true
    volumes:
      - rabbitmq_data:/bitnami/rabbitmq/mnesia
    networks:
      - app-networks

  node-api:
    container_name: apps_trabalho_final-node
    build:
      context: ./node-api
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
    networks:
      - app-networks

  python-api:
    container_name: apps_trabalho_final-python
    build:
      context: ./python-api
    ports:
      - "5000:5000"
    depends_on:
      - node-api
      - redis
    networks:
      - app-networks

  # php-api:
  #   build:
  #     context: ./php-api
  #   depends_on:
  #     - db
  #     - rabbitmq
  #   environment:
  #     DB_USER: positivo
  #     DB_PASSWORD: root
  #     DB_NAME: sistemademensagem
